# This theme extends the default theme:
#     https://github.com/asciidoctor/asciidoctor-pdf/blob/master/data/themes/default-theme.yml
extends: default

font:
  catalog:
    merge: true
    Georgia:
      normal: georgia/Georgia-Regular-font.ttf 
      bold: georgia/georgia-bold.ttf
      italic: georgia/georgia-italic.ttf
      bold_italic: georgia/Georgia-Bold-Italic-font.ttf
    Open Sans:
      normal: OpenSans/OpenSans/OpenSans-Regular.ttf 
      bold: OpenSans/OpenSans/OpenSans-Bold.ttf
      italic: OpenSans/OpenSans/OpenSans-BoldItalic.ttf
      bold_italic: OpenSans/OpenSans-Italic-VariableFont_wdth,wght.ttf
    Source Code Pro:
      normal: SourceCodePro/SourceCodePro-Regular.ttf
      bold: SourceCodePro/SourceCodePro-Bold.ttf
      italic: SourceCodePro/SourceCodePro-Italic.ttf
      bold_italic: SourceCodePro/SourceCodePro-BoldItalic.ttf
    Roboto:
      normal: Roboto/static/Roboto-Regular.ttf
      bold: Roboto/static/Roboto-Bold.ttf
      italic: Roboto/static/Roboto-Italic.ttf
      bold_italic: Roboto/static/Roboto-BoldItalic.ttf
    Calibri:
      normal: Calibri/calibri.ttf
      bold: Calibri/calibrib.ttf
      italic: Calibri/calibrii.ttf
      bold_italic: Calibri/calibriz.ttf
    JetBrains Mono:
      normal: JetBrains Mono/fonts/ttf/JetBrainsMono-Regular.ttf
      bold: JetBrains Mono/fonts/ttf/JetBrainsMono-Bold.ttf
      italic: JetBrains Mono/fonts/ttf/JetBrainsMono-Italic.ttf
      bold_italic: JetBrains Mono/fonts/ttf/JetBrainsMono-BoldItalic.ttf
    Consolas:
      normal: Consolas/consolas.ttf
      bold: Consolas/consolasb.ttf
      italic: Consolas/consolasi.ttf
      bold_italic: Consolas/consolasz.ttf
    
    MDI:
      normal: material-icons/MaterialIcons-Regular.ttf
    Bundled M+ 1mn:
      normal: GEM_FONTS_DIR/mplus1mn-regular-subset.ttf
      bold: GEM_FONTS_DIR/mplus1mn-bold-subset.ttf
      italic: GEM_FONTS_DIR/mplus1mn-italic-subset.ttf
      bold_italic: GEM_FONTS_DIR/mplus1mn-bold_italic-subset.ttf
    Bundled Noto Serif:
      normal: GEM_FONTS_DIR/notoserif-regular-subset.ttf
      bold: GEM_FONTS_DIR/notoserif-bold-subset.ttf
      italic: GEM_FONTS_DIR/notoserif-italic-subset.ttf
      bold_italic: GEM_FONTS_DIR/notoserif-bold_italic-subset.ttf
    Noto Sans:
      normal: GEM_FONTS_DIR/notosans-regular-subset.ttf
      bold: GEM_FONTS_DIR/notosans-bold-subset.ttf
      italic: GEM_FONTS_DIR/notosans-italic-subset.ttf
      bold_italic: GEM_FONTS_DIR/notosans-bold_italic-subset.ttf
      
base:
  font-color: #222633
  font-family: Calibri  
  font-size: 10
  line-height: 1.2

heading:
  #font-color: #222633   
  font-color: #5fedac


fallbacks:
  - Noto Sans
# see definitions here: https://github.com/prawnpdf/pdf-core/blob/0.6.0/lib/pdf/core/page_geometry.rb#L16-L68
# technical books recommendation is 8.5x11in
# see leanpub article on this: http://help.leanpub.com/en/articles/2794627-why-does-each-ebook-size-only-correspond-to-a-subset-of-the-print-ready-pdf-export-sizes-also-how-can-i-make-a-7-x-10-or-a-7-5-x-9-25-print-ready-pdf
# and http://help.leanpub.com/en/articles/2247421-what-pdf-book-sizes-do-you-offer-under-custom-themes
page:
  layout: portrait
  # apply a higher margin size instead of 0.75in
  # to be able to squeeze in the page to centered
  # across a shorter line length
  # try: 1.45in on both sides
  margin: [0.85in, 0.75in, 1in, 0.75in]
  margin-inner: 1.25in
  margin-outer: 0.75in
  #size: A4
  size: 8.5in x 11in

code:
  font:
    family: Consolas
    size: 10
  breakable: false
  background-color: #f7f8fa
  border-color: #e0e3ea
  border-width: 0.4
  border-radius: 4

codespan:
  font-family: Consolas
  font-color: #232229
  # background-color: #eedffd
  # border-radius: 3
  # border-offset: 2
  

# ICONS (RESPECTED WHEN USING icons=font)
admonition:
  font-size: $base-font-size
  text-align: left
  column-rule-color: #eeeeee
  column-rule-width: 0.5
  background-color: #FFFFFF
  border-color: #E6E8FA
  border-radius: 3
  border-style: solid
  font-kerning: none
  font-style: normal
  padding: 0.3cm
  label:
    warning:
      font-size: 0
      font-color: #ffffff
    tip: 
      font-size: 0
      font-color: #ffffff
    note:
      font-size: 0
      font-color: #ffffff
    important:
      font-size: 0
      font-color: #ffffff
    caution:
      font-size: 0
      font-color: #ffffff
  icon:
    tip:
      name: fas-lightbulb
      stroke-color: #5fedac
      size: 14
    note:
      name: fas-info-circle
      stroke-color: #4a6ef4
      size: 14
    important:
      name: fas-exclamation-circle
      stroke-color: #7843ed
      size: 14
    caution:
      name: fas-radiation
      stroke-color: #ef7a2b
      size: 14
    warning:
      name: fas-bomb
      stroke-color: #ff5072
      size: 14

# TIP (Green)
admonition_tip:
  font_color: #218c5a
  background-color: #e9fdf3
  border-color: #5fedac
  border-style: solid
  border-width: 0.4
  border-radius: 4
  font-size: $base-font-size
  font-family: Calibri
  text-align: left
  padding: 0.3cm
  breakable: false

# NOTE (Blue)
admonition_note:
  font_color: #27408b
  background-color: #eef2fd
  border-color: #4a6ef4
  border-style: solid
  border-width: 0.4
  border-radius: 4
  font-size: $base-font-size
  font-family: Calibri
  text-align: left
  padding: 0.3cm
  breakable: false

# IMPORTANT (Purple)
admonition_important:
  font_color: #4a2a8c
  background-color: #f2effd
  border-color: #7843ed
  border-style: solid
  border-width: 0.4
  border-radius: 4
  font-size: $base-font-size
  font-family: Calibri
  text-align: left
  padding: 0.3cm
  breakable: false

# CAUTION (Orange)
admonition_caution:
  font_color: #a85a1a
  background-color: #fdf4ec
  border-color: #ef7a2b
  border-style: solid
  border-width: 0.4
  border-radius: 4
  font-size: $base-font-size
  font-family: Calibri
  text-align: left
  padding: 0.3cm
  breakable: false

# WARNING (Red)
admonition_warning:
  font_color: #b02a4a
  background-color: #fff1f5
  border-color: #ff5072
  border-style: solid
  border-width: 0.4
  border-radius: 4
  font-size: $base-font-size
  font-family: Calibri
  text-align: left
  padding: 0.3cm
  breakable: false

# LISTS
list:
  text-align: left

sidebar:
  align: left  

toc:
  font_size: 10

vertical-spacing: 26

prose:
  margin-bottom: 16

quote:
  border-color: #E6E8FA
  border-left-width: 5
  border-width: 0.5
  padding: [3, 0, 3, 20]

table:
  caption-side: bottom
  font:
    size: 12

image:
  width: 60%
  align: center
  caption:
    end: bottom
    text-align: center
  border-color: "#CCCCCC"
  border-width: 2
  border-radius: 5
  border-fit: content
  border-style: solid

link:
  font-color: #002FA7

conum:
  font-color: #000000
  line-height: 1.2
  font-size: 12
  font-kerning: none
  glyphs: filled
    
footer:
  recto:
    right:
      content: '{chapter-title} | *{page-number}*'
  verso:
    left:
      content: '*{page-number}* | {chapter-title}'


